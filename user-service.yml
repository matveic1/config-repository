  server:
    port: ${USER_SERVICE_PORT:8081}

  spring:
    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5433/postgres}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:admin}

    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

    application:
      name: user-service

  app:
    kafka:
      topic: user-events